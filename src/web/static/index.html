<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3028">
  <title>砺金研策 · 多策略选股研究平台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M9 31.5 18 22l6.2 6.1L39 12"/><path d="M32 12h7v7"/><path d="M9 39h30"/></svg>
        </div>
        <div><strong>砺金研策</strong><span>MULTI-STRATEGY RESEARCH</span></div>
      </div>

      <nav class="main-nav" aria-label="主导航">
        <button class="nav-item shell-nav active" data-shell-page="home">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
          <span>策略总览</span><span class="nav-count" id="strategyNavCount">0</span>
        </button>
        <div class="strategy-catalog-nav" id="strategyCatalogNav"></div>
        <div id="strategyNavigation"></div>
      </nav>

      <div class="sidebar-bottom">
        <div class="source-health"><span class="health-dot"></span><div><strong>本地研究环境</strong><span id="sourceText">策略就绪后显示数据状态</span></div></div>
        <p class="disclaimer">研究辅助工具 · 不构成投资建议</p>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="展开菜单">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar-context"><span class="eyebrow">研究工作台</span><strong id="pageTitle">策略总览</strong></div>
        <div class="topbar-actions">
          <label class="run-select-wrap strategy-control hidden" title="切换运行记录"><span>数据批次</span><select id="runSelect" aria-label="选择运行记录"></select></label>
          <button class="icon-button strategy-control hidden" id="refreshButton" title="刷新数据"><svg viewBox="0 0 24 24"><path d="M20 6v5h-5"/><path d="M19 11a7 7 0 1 0 .2 5"/></svg></button>
          <button class="primary-button strategy-control hidden" id="newScreenButton"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>启动新筛选</button>
        </div>
      </header>

      <div class="loading-bar" id="loadingBar"></div>
      <section class="page active" id="page-home">
        <div class="page-heading strategy-home-heading">
          <div><span class="overline">STRATEGY PORTFOLIO</span><h1>选股策略总览</h1><p>集中查看不同策略的定位、运行状态与候选产出，再进入独立策略工作台。</p></div>
          <div class="strategy-count-chip"><span>已接入策略</span><strong id="strategyCount">—</strong></div>
        </div>
        <div class="strategy-platform-summary panel">
          <div><span class="panel-kicker">RESEARCH ARCHITECTURE</span><h2>策略相互独立，共享可信基础设施</h2><p>数据、执行与任务观测由平台统一提供；选股规则、结果投影和展示模块由每个策略自行维护。</p></div>
          <div class="architecture-flow"><span>数据层</span><i>→</i><span>策略层</span><i>→</i><span>执行层</span><i>→</i><span>展示层</span></div>
        </div>
        <div class="strategy-grid" id="strategyGrid"></div>
        <div class="empty-state panel hidden" id="strategyEmpty"><h3>暂未接入选股策略</h3><p>注册策略模块后会自动出现在这里。</p></div>
      </section>
      <div id="strategyWorkspace"></div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <div id="strategyOverlays"></div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
