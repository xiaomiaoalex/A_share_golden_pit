name: Offline quality gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked direct dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check Python imports and undefined names
        run: python -m ruff check --select F,I main.py web_app.py deploy_check.py src tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend modules
        run: >-
          node --check src/web/static/app.js &&
          node --check src/strategies/golden_pit/presentation/static/app.js
