services:
  strategy-platform:
    build: .
    container_name: ashare-strategy-platform
    volumes:
      # 持久化数据
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - PLATFORM_API_TOKEN=${PLATFORM_API_TOKEN:?请先设置 PLATFORM_API_TOKEN}
    ports:
      - "8765:8765"
    restart: unless-stopped
