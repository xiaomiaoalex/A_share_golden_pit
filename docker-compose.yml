services:
  golden-pit:
    build: .
    container_name: golden-pit-db
    volumes:
      # 持久化数据
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
    # 交互式运行，便于执行命令
    stdin_open: true
    tty: true
    # 默认进入bash，按正式Stage A/B/C命令手动执行
    command: /bin/bash
